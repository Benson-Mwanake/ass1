<!DOCTYPE html>
<html>
<head>
    <title>Contact IT Department</title>
</head>

<body>

<header>
    <h1>Department of Information Technology</h1>
    <p>Student Enquiry</p>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="courses.html">Courses</a> |

<main>

<section>
    <h2>Student Enquiry Form</h2>

    <p>
        Students can use the form below to send an enquiry to the department.
    </p>

    <form>

        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="6" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Submit Enquiry">

    </form>

</section>

</main>

<footer>
    <p>Department of Information Technology &copy; 2026</p>
</footer>

</body>
</html>
